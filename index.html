<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We've Moved! | aditiaangga.id</title>
  
  <!-- Auto redirect to new domain after 5 seconds -->
  <meta http-equiv="refresh" content="5;url=https://aditiaangga.id">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .notice-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
      border-top: 5px solid #0969da;
    }
    .badge {
      display: inline-block;
      background-color: #e1f5fe;
      color: #0288d1;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
      color: #1f2328;
    }
    p {
      color: #57606a;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #0969da;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background-color: #0451a5;
      transform: translateY(-1px);
    }
    .subtext {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #8c959f;
    }
  </style>
</head>
<body>

  <main class="notice-card">
    <span class="badge">New Home 🚀</span>
    <h1>We’ve Moved!</h1>
    <p>
      Hey there! This site has officially relocated to <strong>aditiaangga.id</strong>. Head over to check out the updated space!
    </p>
    
    <a href="https://aditiaangga.id" class="btn">Take Me There</a>

    <p class="subtext">
      Redirecting you automatically in <span id="countdown">5</span>s...
    </p>
  </main>

  <script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');
    
    const interval = setInterval(() => {
      seconds--;
      if (countdownEl) countdownEl.textContent = seconds;
      if (seconds <= 0) clearInterval(interval);
    }, 1000);
  </script>

</body>
</html>
