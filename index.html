<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Saya | GitHub Pages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #0969da;
      margin-bottom: 12px;
      font-size: 1.8rem;
    }
    p {
      color: #57606a;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #2da44e;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Halo, World! 👋</h1>
    <p>Website ini berhasil di-deploy menggunakan <strong>GitHub Pages</strong> dengan custom domain.</p>
    <a href="https://github.com" target="_blank" class="btn">Kunjungi GitHub</a>
  </main>

</body>
</html>
